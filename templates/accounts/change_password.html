{% extends "base.html" %}
{% block title %}Change Password — Novem Controls CRM{% endblock %}
{% block breadcrumb %}
<a href="{% url 'accounts:profile' %}" class="text-muted">My Profile</a>
<i class="bi bi-chevron-right mx-1 text-muted" style="font-size:11px;"></i>
<span class="breadcrumb-item">Change Password</span>
{% endblock %}

{% block content %}
<div class="page-header">
  <div class="page-header-left">
    <h1 class="page-title">Change Password</h1>
  </div>
</div>

<div class="row">
  <div class="col-12 col-md-5">
    <div class="crm-form-card">
      <form method="post" novalidate>
        {% csrf_token %}
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label">Current Password <span class="text-danger">*</span></label>
            <input type="password" name="old_password" class="form-control" placeholder="Enter current password" required />
          </div>
          <div class="col-12">
            <label class="form-label">New Password <span class="text-danger">*</span></label>
            <input type="password" name="new_password1" class="form-control" placeholder="At least 8 characters" required />
          </div>
          <div class="col-12">
            <label class="form-label">Confirm New Password <span class="text-danger">*</span></label>
            <input type="password" name="new_password2" class="form-control" placeholder="Repeat new password" required />
          </div>
        </div>
        <div class="alert alert-info mt-3 fs-13 py-2">
          <i class="bi bi-info-circle me-1"></i>
          Password must be at least 8 characters long.
        </div>
        <div class="mt-4 d-flex gap-3">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-shield-lock-fill me-2"></i>Change Password
          </button>
          <a href="{% url 'accounts:profile' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
